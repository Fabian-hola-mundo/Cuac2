@let cfg = config();

<div
  class="rw"
  [class.rw--girando]="girando()"
  [style.--rw-aro]="cfg.color_aro"
  [style.--rw-puntero]="cfg.color_puntero"
  [style.--rw-hub]="cfg.color_hub"
  [style.--rw-hub-texto]="cfg.color_hub_texto"
  [style.--rw-acento]="cfg.color_acento">

  <div class="rw-stage" #escenario>
    <svg
      class="rw-svg"
      viewBox="0 0 420 420"
      role="img"
      [attr.aria-label]="'Ruleta con ' + porciones().length + ' opciones'">

      <defs>
        <!-- Oscurecido hacia el borde: le da volumen al disco sin tapar el color. -->
        <radialGradient [attr.id]="uid + '-sombra'" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#000" stop-opacity="0" />
          <stop offset="62%"  stop-color="#000" stop-opacity="0" />
          <stop offset="100%" stop-color="#000" stop-opacity="0.22" />
        </radialGradient>

        <!-- Reflejo diagonal muy tenue, como el de un disco lacado. -->
        <linearGradient [attr.id]="uid + '-brillo'" x1="12%" y1="0%" x2="70%" y2="100%">
          <stop offset="0%"   stop-color="#fff" stop-opacity="0.20" />
          <stop offset="42%"  stop-color="#fff" stop-opacity="0.04" />
          <stop offset="100%" stop-color="#fff" stop-opacity="0" />
        </linearGradient>

        <filter [attr.id]="uid + '-sombra-disco'" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.30" />
        </filter>

        <filter [attr.id]="uid + '-sombra-puntero'" x="-60%" y="-60%" width="220%" height="220%">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35" />
        </filter>
      </defs>

      <!-- ── Aro exterior + bombillas ─────────────────────────────────────── -->
      <g [attr.filter]="'url(#' + uid + '-sombra-disco)'">
        <circle [attr.cx]="CX" [attr.cy]="CY" [attr.r]="R_ARO" fill="none"
                [attr.stroke]="cfg.color_aro" stroke-width="19" />
        <!-- Filo interior: marca el canto del aro sin apagar su color. -->
        <circle [attr.cx]="CX" [attr.cy]="CY" [attr.r]="R_ARO - 9" fill="none"
                stroke="#000" stroke-opacity="0.14" stroke-width="1.5" />
      </g>

      @for (l of luces(); track l.i) {
        <circle
          class="rw-luz"
          [attr.cx]="l.x"
          [attr.cy]="l.y"
          r="4.6"
          [style.animation-delay.ms]="l.i * 90" />
      }

      @if (hayOpciones()) {
        <!-- ── Disco giratorio ────────────────────────────────────────────── -->
        <g #rueda class="rw-rueda">
          @for (p of porciones(); track p.id) {
            <path [attr.d]="p.path" [attr.fill]="p.color"
                  [attr.stroke]="cfg.color_aro" stroke-width="1.6" stroke-linejoin="round" />
          }

          <circle [attr.cx]="CX" [attr.cy]="CY" [attr.r]="R_PORCION"
                  [attr.fill]="'url(#' + uid + '-sombra)'" />
          <circle [attr.cx]="CX" [attr.cy]="CY" [attr.r]="R_PORCION"
                  [attr.fill]="'url(#' + uid + '-brillo)'" />

          @for (p of porciones(); track p.id) {
            <g [attr.transform]="p.transform">
              <text
                class="rw-etiqueta"
                [attr.x]="R_ETIQUETA"
                [attr.y]="p.mostrarDesc ? -p.fuente * 0.42 : 0"
                [attr.font-size]="p.fuente"
                [attr.fill]="p.colorTexto"
                text-anchor="end"
                dominant-baseline="middle">{{ p.etiqueta }}</text>

              @if (p.mostrarDesc) {
                <text
                  class="rw-etiqueta-desc"
                  [attr.x]="R_ETIQUETA"
                  [attr.y]="p.fuente * 0.68"
                  [attr.font-size]="p.fuenteDesc"
                  [attr.fill]="p.colorTexto"
                  text-anchor="end"
                  dominant-baseline="middle">{{ p.descripcion }}</text>
              }
            </g>
          }

          <!-- Remaches: dan la sensación de que el disco está atornillado al aro. -->
          @for (p of porciones(); track p.id) {
            <circle
              class="rw-remache"
              [attr.cx]="p.remacheX"
              [attr.cy]="p.remacheY"
              r="2.6"
              [attr.fill]="cfg.color_aro"
              fill-opacity="0.85" />
          }
        </g>
      } @else {
        <circle [attr.cx]="CX" [attr.cy]="CY" [attr.r]="R_PORCION" fill="#151F28" fill-opacity="0.12" />
        <text [attr.x]="CX" [attr.y]="CY - 4" text-anchor="middle" class="rw-vacia"
              [attr.fill]="cfg.color_texto">Sin opciones activas</text>
      }

      <!-- ── Tapa central ───────────────────────────────────────────────────── -->
      <circle [attr.cx]="CX" [attr.cy]="CY + 3" [attr.r]="R_HUB + 5" fill="#000" fill-opacity="0.22" />
      <circle [attr.cx]="CX" [attr.cy]="CY" [attr.r]="R_HUB + 5" [attr.fill]="cfg.color_aro" />

      <!-- ── Puntero ────────────────────────────────────────────────────────── -->
      <g #puntero class="rw-puntero" [attr.filter]="'url(#' + uid + '-sombra-puntero)'">
        <path
          d="M 210 58 L 189 16 A 22 22 0 0 1 231 16 Z"
          [attr.fill]="cfg.color_puntero" />
        <circle cx="210" cy="19" r="6" [attr.fill]="cfg.color_aro" fill-opacity="0.9" />
      </g>
    </svg>

    <!-- El botón vive fuera del SVG: así es un botón de verdad para el teclado
         y los lectores de pantalla, no un <path> con un click encima. -->
    <button
      type="button"
      class="rw-boton"
      [disabled]="girando() || !hayOpciones() || !interactivo()"
      [attr.aria-busy]="girando()"
      [attr.aria-label]="girando() ? cfg.boton_girando_texto : cfg.boton_texto + ' la ruleta'"
      (click)="girar()">
      @if (girando()) {
        <!-- La tapa es demasiado pequeña para una palabra larga: mientras gira
             muestra tres puntos y el texto se lee debajo de la rueda. -->
        <span class="rw-puntos" aria-hidden="true"><i></i><i></i><i></i></span>
      } @else {
        <span class="rw-boton-txt">{{ cfg.boton_texto }}</span>
      }
    </button>
  </div>

  <p class="rw-estado" aria-hidden="true">
    @if (girando()) { {{ cfg.boton_girando_texto }} }
  </p>

  <canvas #lienzo class="rw-confeti" [class.is-on]="confetiActivo()" aria-hidden="true"></canvas>

  <p class="sr-only" aria-live="polite">
    @if (ganadora(); as g) { {{ cfg.resultado_titulo }} {{ g.etiqueta }} }
  </p>
</div>
